name: Deploy

on:
  push:
    branches: [production]
  # Lets you rerun a deploy (or go back to an older one) without pushing a commit.
  workflow_dispatch:

concurrency:
  group: deploy-nova-api
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/atmosferasoltec/atm-nova-api

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Project rule: main -> production. A commit that did not go
      # through main is not deployed.
      - name: Ensure the commit is already in main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::El commit $GITHUB_SHA no esta en main. Flujo obligatorio: main -> production."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=nova-api
          cache-to: type=gha,scope=nova-api,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/docker-compose.yml
          sparse-checkout-cone-mode: false

      # One SSH connection (ControlMaster) to copy the compose file and deploy, with
      # retries when opening it: if sshd or fail2ban cut a stray handshake, the
      # deploy does not fail because of it.
      - name: Copy compose file and deploy on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          opts=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20
            -o ServerAliveInterval=15 -o ControlMaster=auto -o ControlPath=~/.ssh/cm-%C -o ControlPersist=120)
          target="$SSH_USER@$SSH_HOST"

          for attempt in 1 2 3 4 5; do
            if ssh "${opts[@]}" "$target" true; then break; fi
            if [ "$attempt" = 5 ]; then echo "::error::No se pudo abrir la conexion SSH tras 5 intentos"; exit 1; fi
            echo "SSH fallo (intento $attempt); reintento en $((attempt * 10)) s"
            sleep $((attempt * 10))
          done

          scp "${opts[@]}" deploy/docker-compose.yml "$target:/opt/nova-api/docker-compose.yml"

          # The GHCR login lives on the server (~/.docker/config.json). If the pull
          # says `denied`, renew it with `docker login ghcr.io` on the VPS.
          ssh "${opts[@]}" "$target" "IMAGE_TAG=$IMAGE_TAG bash -s" <<'REMOTE'
          set -e
          cd /opt/nova-api

          if [ ! -f .env ]; then
            echo "::error::Falta /opt/nova-api/.env en el servidor"
            exit 1
          fi

          export IMAGE_TAG
          docker compose pull
          docker compose up -d
          # Cleanup is optional: another project's deploy may be pruning at the same
          # time, which must not fail this one.
          docker image prune -f || true

          # The scaffold has no health route yet, so "up" means the container keeps
          # running and answers HTTP on loopback. Any status code proves it listens.
          for _ in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3101/ || true)"
            if [ "$(docker inspect --format '{{.State.Running}}' nova-api 2>/dev/null)" = "true" ] && [ "$code" != "000" ] && [ -n "$code" ]; then
              echo "nova-api responde (HTTP ${code}, ${IMAGE_TAG})."
              exit 0
            fi
            sleep 2
          done

          echo "::error::nova-api no responde en 120s. Ultimos logs:"
          docker compose logs --tail 50 app
          exit 1
          REMOTE
